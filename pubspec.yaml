name: air_monitor
description: ESP32 Air Quality Monitor

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  mqtt_client: ^10.2.1
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.10.0
  intl: ^0.18.1

flutter:
  uses-material-design: true
  assets:
    - assets/certs/ca.crt


flutter_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"  # 替换为你上传的图标路径